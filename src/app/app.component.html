<header class="toolbar">
  <div class="toolbar-left">
    <div class="logo" aria-hidden>
      <img src="../assets/robotpng.png" alt="QA Robot" class="logo-img" />
    </div>
    <div class="brand">
      <div class="brand-title">QA - Global Bank</div>
    </div>
  </div>

  <nav class="toolbar-nav" role="navigation" aria-label="Main navigation">
    <a routerLink="/dashboard" routerLinkActive="nav-btn--active" class="nav-btn" aria-label="Dashboard">
      <span class="nav-icon" aria-hidden>📊</span>
      <span class="nav-label">Dashboard</span>
    </a>
    <a routerLink="/sprints" routerLinkActive="nav-btn--active" class="nav-btn" aria-label="Gestionar sprints">
      <span class="nav-icon" aria-hidden>🏃</span>
      <span class="nav-label">Gestionar Sprints</span>
    </a>
  </nav>
</header>

<main class="content">
  <button *ngIf="!isDashboard" class="btn-back" (click)="goBack()" title="Volver atrás" aria-label="Volver atrás">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    <span>Volver</span>
  </button>
  <router-outlet></router-outlet>
  <app-toast></app-toast>
  <app-confirm></app-confirm>
</main>
